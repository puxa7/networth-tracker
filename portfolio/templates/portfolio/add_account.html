{% extends 'portfolio/base.html' %}
{% block title %}Add account{% endblock %}

{% block content %}
<p class="back-link"><a href="{% url 'home' %}">&larr; Back to accounts</a></p>

<h1>Add account</h1>

<div class="card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button type="submit">Create account</button>
            <a href="{% url 'home' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
