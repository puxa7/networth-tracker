{% extends 'portfolio/base.html' %}
{% block title %}Log In{% endblock %}

{% block content %}
<div class="auth-box">
    <h1>Log In</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log In</button>
    </form>

    <p>Don't have an account yet? <a href="{% url 'register' %}">Sign up</a></p>
</div>
{% endblock %}
