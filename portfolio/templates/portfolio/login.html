{% extends 'portfolio/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}

<h3>Log In</h3>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log In</button>
</form>

<p>Don't have an account yet? <a href="{% url 'register' %}">Sign up</a></p>

{% endblock %}
