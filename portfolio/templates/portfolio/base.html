{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}NetWorth{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'portfolio/style.css' %}?v=2">
</head>

<body>
    {% if user.is_authenticated %}
    <header>
        <nav>
            <a href="{% url 'home' %}">Home</a> |
            <a href="{% url 'settings' %}">Settings</a> |
            <span>Logged in as: <strong>{{ user.username }}</strong></span>
            <form action="{% url 'logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        </nav>
        <hr>
    </header>
    {% endif %}

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>

</html>
