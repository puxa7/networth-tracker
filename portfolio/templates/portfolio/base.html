{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}NetWorth{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'portfolio/style.css' %}?v=3">
</head>

<body>
    {% if user.is_authenticated %}
    <header class="navbar">
        <nav class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'settings' %}">Settings</a>
        </nav>

        <div class="nav-user">
            <span><strong>{{ user.username }}</strong></span>
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="btn-secondary">Logout</button>
            </form>
        </div>
    </header>
    {% endif %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script src="{% static 'portfolio/main.js' %}?v=1"></script>
</body>

</html>
